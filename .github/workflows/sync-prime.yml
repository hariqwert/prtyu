name: Sync Prime Video Sports Feeds

on:
  schedule:
    - cron: '30 */6 * * *' # Every 6 hours
  workflow_dispatch:

jobs:
  sync-prime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Prime Sports Streams (Primary + Backups)
        run: node scripts/sync-sources.js prime

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/prime/
          git diff-index --quiet HEAD || git commit -m "chore(sync): auto-update Prime Sports live sources"
          git push
