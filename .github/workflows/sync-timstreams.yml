name: Sync TimStreams & Live Channels

on:
  schedule:
    - cron: '30 */3 * * *' # Every 3 hours
  workflow_dispatch:

jobs:
  sync-timstreams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync TimStreams Events & Channels (Primary + Backups)
        run: node scripts/sync-sources.js timstreams

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/timstreams/
          git diff-index --quiet HEAD || git commit -m "chore(sync): auto-update TimStreams live sources"
          git push
