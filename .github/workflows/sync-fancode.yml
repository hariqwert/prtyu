name: Sync FanCode Feeds

on:
  schedule:
    - cron: '15 */2 * * *' # Every 2 hours
  workflow_dispatch:

jobs:
  sync-fancode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync FanCode Streams (Primary + Backups)
        run: node scripts/sync-sources.js fancode

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fancode/
          git diff-index --quiet HEAD || git commit -m "chore(sync): auto-update FanCode live sources"
          git push
