name: Sync FIFA & Football Live Feeds

on:
  schedule:
    - cron: '15 */4 * * *' # Every 4 hours
  workflow_dispatch:

jobs:
  sync-fifa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync FIFA & Football Streams (Primary + Backups)
        run: node scripts/sync-sources.js fifa

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/fifa/
          git diff-index --quiet HEAD || git commit -m "chore(sync): auto-update FIFA live sources"
          git push
