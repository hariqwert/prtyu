name: Sync Willow Cricket & ICC Feeds

on:
  schedule:
    - cron: '45 */3 * * *' # Every 3 hours
  workflow_dispatch:

jobs:
  sync-willow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync Willow & ICC Streams (Primary + Backups)
        run: node scripts/sync-sources.js willow

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/willow/
          git diff-index --quiet HEAD || git commit -m "chore(sync): auto-update Willow and ICC live sources"
          git push
