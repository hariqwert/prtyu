name: Sync MatchDekho & Sportzfy Feeds

on:
  schedule:
    - cron: '0 */2 * * *' # Every 2 hours
  workflow_dispatch:

jobs:
  sync-matchdekho:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync MatchDekho Worldwide Sports (Primary + Backups)
        run: node scripts/sync-sources.js matchdekho

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/matchdekho/
          git diff-index --quiet HEAD || git commit -m "chore(sync): auto-update MatchDekho and Sportzfy sources"
          git push
